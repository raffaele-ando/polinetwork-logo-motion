<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/logo-paths.js"></script>
    <script src="assets/brand-assets.js"></script>
    <script src="assets/pn-core.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f1f5f9;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f1f5f9;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        id="stage"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        data-layout-ignore
        width="1920"
        height="1080"
        style="z-index: 1"
      ></canvas>
      <audio
        id="suono"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-volume="1"
        src="assets/audio/ident.wav"
      ></audio>
    </div>

    <script>
      (function () {
        const { clamp, lerp, prog, smooth, outCubic, outQuart, inOutCubic, LOGO } = PN;
        const BRAND = window.PN_BRAND;
        const W = 1920,
          H = 1080;
        const ctx = document.getElementById("stage").getContext("2d");

        // ---- colori del brand system (variabili Figma) ----
        const BG = "#f1f5f9"; // neutrals/background
        const BLUE = LOGO.blue; // blu del logo

        // ---- tempi (secondi) ----
        const T_END = 5;
        const NODE_ON = [0.74, 0.82, 0.22, 1.5, 1.42, 1.16]; // quando compare ogni nodo (A B C D E F)
        // linee piene: da, a, inizio, durata
        const SOLID = [
          [2, 0, 0.46, 0.34],
          [2, 1, 0.54, 0.34],
          [1, 5, 0.86, 0.38],
          [5, 4, 1.18, 0.3],
          [5, 3, 1.24, 0.32],
        ];
        const DOT_T0 = [1.46, 1.54, 1.6, 1.7]; // partenza di ogni linea a pallini
        const DOT_GAP = 0.02;
        const CAM_T0 = 0.22,
          CAM_DUR = 1.85; // la camera parte stretta sul primo nodo e si allarga
        const T_DISC = 2.08; // il disco blu si apre, la rete diventa bianca
        const T_RING = 2.3; // esce il bordo
        const T_REAL = 2.62; // da qui si usano i tracciati originali del logo
        const T_ROLL = 2.78,
          ROLL_DUR = 0.9; // il logo rotola a sinistra e lascia uscire il nome

        // ---- misure ----
        const C1 = [960, 540],
          S1 = 560 / (LOGO.outline * 2); // logo grande al centro: 560 px
        const WM = BRAND.wordmark;
        const K = 9; // scala del logo esteso (151 × 30 nel file Figma)
        const LOCK_X = (W - WM.w * K) / 2,
          LOCK_Y = (H - WM.h * K) / 2;
        const C2 = [LOCK_X + (WM.icon.x + WM.icon.size / 2) * K, LOCK_Y + (WM.icon.y + WM.icon.size / 2) * K];
        const S2 = (WM.icon.size * K) / LOGO.size;
        const wordPath = new Path2D(WM.d);

        // molla: parte da 0, supera 1 e si assesta
        const spring = (t, damp = 9, freq = 14) => (t <= 0 ? 0 : 1 - Math.exp(-damp * t) * Math.cos(freq * t));

        // ---- forme sfumate: si disegnano una volta, già sfocate ----
        function sprite(def) {
          const c = document.createElement("canvas");
          c.width = c.height = def.size;
          const g = c.getContext("2d");
          g.filter = `blur(${def.blur}px)`;
          g.globalAlpha = def.opacity;
          g.fillStyle = def.fill;
          g.fill(new Path2D(def.d));
          return c;
        }
        const SPR = {};
        for (const k in BRAND.shapes) SPR[k] = sprite(BRAND.shapes[k]);
        // dove stanno: centro, grandezza, quando entrano, quanto si spostano nel tempo
        const SHAPES = [
          { k: "big-teal", x: 250, y: 760, size: 1250, t0: 0.0, dx: 46, dy: -30, rot: 0.22 },
          { k: "big-blue", x: 1760, y: 110, size: 1050, t0: 0.12, dx: -50, dy: 34, rot: -0.2 },
          { k: "small-blue", x: 1560, y: 980, size: 560, t0: 0.26, dx: -30, dy: -44, rot: 0.3 },
        ];

        // ---- looper: le curve bianche, che si tracciano una dopo l'altra ----
        const svgNS = "http://www.w3.org/2000/svg";
        const LOOP = BRAND.looper.lines.map((l) => {
          const p = document.createElementNS(svgNS, "path");
          p.setAttribute("d", l.d);
          return { path: new Path2D(l.d), len: p.getTotalLength(), o: l.o };
        });

        const pos = (i) => [(LOGO.nodes[i][0] - LOGO.c) * S1, (LOGO.nodes[i][1] - LOGO.c) * S1];

        // la rete, in un colore solo; coordinate relative al centro del logo
        function drawNet(t, color) {
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineCap = "round";
          ctx.lineWidth = LOGO.solidW * S1;
          for (const [a, b, t0, dur] of SOLID) {
            const g = outQuart(prog(t, t0, dur));
            if (g <= 0) continue;
            const A = pos(a),
              B = pos(b);
            ctx.beginPath();
            ctx.moveTo(A[0], A[1]);
            ctx.lineTo(lerp(A[0], B[0], g), lerp(A[1], B[1], g));
            ctx.stroke();
          }
          for (const d of LOGO.dots) {
            const g = spring(t - (DOT_T0[d.line] + d.k * DOT_GAP), 14, 16);
            if (g <= 0) continue;
            const A = pos(d.a),
              B = pos(d.b);
            ctx.beginPath();
            ctx.arc(lerp(A[0], B[0], d.s), lerp(A[1], B[1], d.s), LOGO.dotR * S1 * g, 0, 6.2832);
            ctx.fill();
          }
          LOGO.nodes.forEach((n, i) => {
            const g = spring(t - NODE_ON[i]);
            if (g <= 0) return;
            const p = pos(i);
            ctx.beginPath();
            ctx.arc(p[0], p[1], n[2] * S1 * g, 0, 6.2832);
            ctx.fill();
          });
        }

        function renderAt(t) {
          t = clamp(t, 0, T_END);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          ctx.filter = "none";
          ctx.fillStyle = BG;
          ctx.fillRect(0, 0, W, H);

          const roll = inOutCubic(prog(t, T_ROLL, ROLL_DUR));
          const bump = t > T_DISC ? Math.exp(-(t - T_DISC) * 5) * Math.sin((t - T_DISC) * 11) : 0; // respiro quando si apre il disco
          const life = t / T_END;

          // ---- sfondo: forme sfumate ----
          for (const s of SHAPES) {
            const g = outCubic(prog(t, s.t0, 1.1));
            if (g <= 0) continue;
            const spr = SPR[s.k];
            const sc = (s.size / spr.width) * (0.78 + 0.22 * g) * (1 + 0.05 * bump);
            ctx.save();
            ctx.translate(s.x + s.dx * life - 70 * roll * (s.x < 960 ? 1 : 0.5), s.y + s.dy * life);
            ctx.rotate(s.rot * life);
            ctx.scale(sc, sc);
            ctx.globalAlpha = g;
            ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
            ctx.restore();
          }
          // ---- sfondo: looper ----
          ctx.save();
          ctx.translate(-330 + 30 * life - 50 * roll, 250 - 20 * life);
          ctx.rotate(-0.12);
          ctx.scale(0.92, 0.92);
          ctx.lineWidth = BRAND.looper.width;
          ctx.lineCap = "round";
          LOOP.forEach((l, i) => {
            const g = inOutCubic(prog(t, 0.15 + i * 0.045, 1.5));
            if (g <= 0) return;
            ctx.strokeStyle = `rgba(248,250,252,${Math.min(1, l.o * 1.7 + 0.15)})`;
            ctx.setLineDash([l.len * g, l.len]);
            ctx.stroke(l.path);
          });
          ctx.setLineDash([]);
          ctx.restore();

          // ---- la rete che si costruisce, poi il disco ----
          if (t < T_REAL + 0.12) {
            const cu = inOutCubic(prog(t, CAM_T0, CAM_DUR));
            const zoom = lerp(2.5, 1, cu);
            const rot = lerp(-0.3, 0, cu);
            const f = pos(2); // la camera parte dal primo nodo
            const fk = 1 - smooth(prog(t, CAM_T0, CAM_DUR * 0.9));
            ctx.save();
            ctx.globalAlpha = 1 - prog(t, T_REAL, 0.12);
            ctx.translate(C1[0], C1[1]);
            ctx.rotate(rot);
            ctx.scale(zoom, zoom);
            ctx.translate(-f[0] * fk, -f[1] * fk);

            drawNet(t, BLUE);

            if (t > T_DISC) {
              const ring = spring(t - T_RING, 10, 13);
              if (ring > 0) {
                ctx.fillStyle = LOGO.dark;
                ctx.beginPath();
                ctx.arc(0, 0, lerp(LOGO.disc, LOGO.outline, ring) * S1, 0, 6.2832);
                ctx.fill();
                ctx.fillStyle = LOGO.white;
                ctx.beginPath();
                ctx.arc(0, 0, lerp(LOGO.disc, LOGO.ringOut, ring) * S1, 0, 6.2832);
                ctx.fill();
              }
              const rd = LOGO.disc * S1 * spring(t - T_DISC, 10, 11);
              ctx.save();
              ctx.beginPath();
              ctx.arc(0, 0, Math.max(0.01, rd), 0, 6.2832);
              ctx.clip();
              ctx.fillStyle = BLUE;
              ctx.fillRect(-600, -600, 1200, 1200);
              drawNet(t, LOGO.white);
              ctx.restore();
            }
            ctx.restore();
          }

          // ---- logo originale: rotola a sinistra, il nome esce da dietro ----
          if (t >= T_REAL) {
            const cx = lerp(C1[0], C2[0], roll),
              cy = lerp(C1[1], C2[1], roll);
            const sc = lerp(S1, S2, roll);

            const wq = outCubic(prog(t, T_ROLL + 0.12, ROLL_DUR - 0.02));
            if (wq > 0) {
              ctx.save();
              ctx.beginPath();
              ctx.rect(cx, 0, W, H);
              ctx.clip();
              ctx.globalAlpha = Math.min(1, wq * 2.5);
              ctx.translate(LOCK_X - (1 - wq) * 320, LOCK_Y);
              ctx.scale(K, K);
              ctx.fillStyle = WM.fill;
              ctx.fill(wordPath);
              ctx.restore();
            }

            ctx.save();
            ctx.globalAlpha = prog(t, T_REAL, 0.12);
            ctx.translate(cx, cy);
            ctx.rotate(-2 * Math.PI * roll);
            PN.drawLogo(ctx, 0, 0, sc, 1);
            ctx.restore();
          }
        }

        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = gsap.timeline({ paused: true });
      })();
    </script>
  </body>
</html>
