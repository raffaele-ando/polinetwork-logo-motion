<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icone di caricamento PoliNetwork</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { background: #f1f5f9; color: #0f172b; font-family: "DM Sans", system-ui, sans-serif; padding: 32px 16px 64px; }
      h1 { font-weight: 500; font-size: 32px; text-align: center; }
      p.intro { text-align: center; margin: 8px auto 28px; max-width: 520px; font-size: 16px; line-height: 1.5; color: #45556c; }
      .bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
      .bar button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 1px solid #cad5e2; background: #fff; color: #0f172b; cursor: pointer; }
      .bar button[aria-pressed="true"] { background: #1055ad; border-color: #1055ad; color: #fff; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
      .cell { border: 0; font: inherit; color: inherit; background: var(--cell, #f8fafc); border-radius: 20px; padding: 18px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
      .cell:focus-visible, .bar button:focus-visible { outline: 3px solid #51a2ff; outline-offset: 2px; }
      .sizes { display: flex; align-items: center; gap: 14px; height: 100px; }
      .cell span { font-size: 14px; color: var(--label, #45556c); }
      #msg { text-align: center; margin-top: 24px; min-height: 24px; font-size: 15px; color: #0069a8; }
    </style>
  </head>
  <body>
    <h1>Icone di caricamento</h1>
    <p class="intro">12 icone fatte con tre nodi del logo, ognuna a 96, 48 e 24 px. Tocca un'icona per copiare il codice che la mostra.</p>
    <div class="bar" role="group" aria-label="Colori">
      <button data-fg="#1055AD" data-bg="#f8fafc" data-label="#45556c" aria-pressed="true">Blu su chiaro</button>
      <button data-fg="#f8fafc" data-bg="#1055AD" data-label="#dbeafe" aria-pressed="false">Bianco su blu</button>
      <button data-fg="#0f172b" data-bg="#f8fafc" data-label="#45556c" aria-pressed="false">Scuro su chiaro</button>
    </div>
    <div class="grid" id="grid"></div>
    <p id="msg" role="status"></p>
    <script>
// Icone di caricamento di PoliNetwork.
//
// Il logo intero è troppo fitto per un'icona: qui si usa un segno ridotto, preso dalla parte bassa
// del logo. Tre nodi di grandezza diversa, due linee piene, una linea a pallini. Dodici icone,
// ognuna con una sola idea, leggibili anche a 24 px.
//
// Questo file contiene i disegni. Per usarle in una pagina serve anche pn-loaders-start.js:
//   PNLoaders.start(canvas, "costruzione", { fg: "#1055AD", bg: "#f1f5f9", period: 2.4 });
// (bg serve dove il disegno ha dei vuoti o si inverte). Vedi anteprima.html per un esempio completo.
//
// Ogni icona è una funzione draw(ctx, u, c): u va da 0 a 1 e poi ricomincia, c = { fg, bg }.
// Il disegno sta in un quadrato di 1000 unità, centrato in (0, 0).
(function () {
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const sm = (u) => {
    u = clamp(u);
    return u * u * (3 - 2 * u);
  };
  const eio = (u) => {
    u = clamp(u);
    return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  };
  const step = (u, t0, d) => sm((u - t0) / d); // sale da 0 a 1 a partire da t0, in d
  // gobba morbida centrata in c, larga w, che gira su sé stessa (per i loop)
  const bump = (u, c, w) => {
    const d = Math.abs(((((u - c + 0.5) % 1) + 1) % 1) - 0.5);
    return d < w ? sm(1 - d / w) : 0;
  };

  // ---- il segno: i tre nodi in basso nel logo (E, F, D), con le loro linee ----
  // posizioni prese dal logo e ingrandite; i raggi sono un po' più diversi tra loro, per leggersi in piccolo
  const N = [
    [-345, 60, 94], // 0  a sinistra, il piccolo
    [20, 190, 116], // 1  in basso, il medio
    [335, -170, 142], // 2  in alto a destra, il grande
  ];
  const SOLID = [
    [0, 1],
    [1, 2],
  ];
  const DOTTED = [0, 2]; // la linea a pallini: dal piccolo al grande
  const LW = 76, // spessore delle linee
    DOT_R = 34,
    DOT_N = 3;
  // dove stanno i pallini (0..1 lungo la linea), tra il bordo di un nodo e quello dell'altro
  const dotsAt = (A, B) => {
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    const s0 = (A[2] + 62) / L,
      s1 = 1 - (B[2] + 62) / L;
    const out = [];
    for (let k = 0; k < DOT_N; k++) out.push(lerp(s0, s1, k / (DOT_N - 1)));
    return out;
  };

  // ---- mattoni ----
  const dot = (ctx, x, y, r) => {
    if (r <= 0.2) return;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  };
  const seg = (ctx, A, B, g0, g1, w) => {
    if (g1 - g0 <= 0.001 || w <= 0.2) return;
    ctx.lineWidth = w;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(lerp(A[0], B[0], g0), lerp(A[1], B[1], g0));
    ctx.lineTo(lerp(A[0], B[0], g1), lerp(A[1], B[1], g1));
    ctx.stroke();
  };
  // il segno. o può cambiare: pos(i) → [x, y, r]; solid(j) → [da, a]; width(j); dotScale(k); node(i) → scala
  const sign = (ctx, color, o = {}) => {
    const pos = o.pos || ((i) => N[i]);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    SOLID.forEach(([a, b], j) => {
      const g = o.solid ? o.solid(j) : [0, 1];
      seg(ctx, pos(a), pos(b), g[0], g[1], o.width ? o.width(j) : LW);
    });
    if (o.dots !== false) {
      const A = pos(DOTTED[0]),
        B = pos(DOTTED[1]);
      dotsAt(A, B).forEach((s, k) => dot(ctx, lerp(A[0], B[0], s), lerp(A[1], B[1], s), DOT_R * (o.dotScale ? o.dotScale(k) : 1)));
    }
    for (let i = 0; i < 3; i++) {
      const p = pos(i);
      dot(ctx, p[0], p[1], p[2] * (o.node ? o.node(i) : 1));
    }
  };

  const L = [];
  const add = (id, name, draw) => L.push({ id, name, draw });

  // 1 — il segno si costruisce: nodo, linea, nodo, linea, nodo, pallini. Poi si ritira nello stesso ordine
  add("costruzione", "Costruzione", (ctx, u, c) => {
    const OFF = 0.56;
    const nOn = [0, 0.17, 0.34],
      eOn = [0.05, 0.22];
    sign(ctx, c.fg, {
      node: (i) => step(u, nOn[i], 0.08) * (1 - step(u, OFF + nOn[i], 0.08)),
      solid: (j) => [eio((u - OFF - eOn[j]) / 0.14), eio((u - eOn[j]) / 0.14)],
      dotScale: (k) => step(u, 0.4 + (2 - k) * 0.035, 0.05) * (1 - step(u, OFF + 0.36 + (2 - k) * 0.03, 0.05)),
    });
  });

  // 2 — un segnale fa il giro: lungo le due linee piene, poi torna lungo i pallini
  add("segnale", "Segnale", (ctx, u, c) => {
    const ring = 34;
    ctx.strokeStyle = c.fg;
    SOLID.forEach(([a, b]) => seg(ctx, N[a], N[b], 0, 1, LW));
    const stops = [0, 1, 2, 0];
    const f = u * 3,
      j = Math.min(2, Math.floor(f)),
      g = eio(f - j);
    const A = N[stops[j]],
      B = N[stops[j + 1]];
    // i pallini si accendono quando il segnale ci passa
    const ds = dotsAt(N[0], N[2]);
    ctx.fillStyle = c.fg;
    ds.forEach((s) => dot(ctx, lerp(N[0][0], N[2][0], s), lerp(N[0][1], N[2][1], s), DOT_R * (j === 2 ? 1 + 0.9 * clamp(1 - Math.abs(1 - g - s) / 0.22) : 1)));
    // nodi vuoti, ad anello
    N.forEach((p) => {
      ctx.fillStyle = c.bg;
      dot(ctx, p[0], p[1], p[2]);
      ctx.strokeStyle = c.fg;
      ctx.lineWidth = ring;
      ctx.beginPath();
      ctx.arc(p[0], p[1], p[2] - ring / 2, 0, TAU);
      ctx.stroke();
    });
    // il segnale: riempie il nodo da cui parte e quello in cui arriva
    const near = Math.min(g, 1 - g) * 2; // 0 sui nodi, 1 a metà strada
    const r = lerp(g < 0.5 ? A[2] - ring - 8 : B[2] - ring - 8, 40, sm(near * 2.2));
    ctx.fillStyle = c.fg;
    dot(ctx, lerp(A[0], B[0], g), lerp(A[1], B[1], g), r);
  });

  // 3 — "sta scrivendo…": tre puntini in fila che diventano il segno, e tornano puntini
  add("scrivendo", "Sta scrivendo", (ctx, u, c) => {
    const m = eio((u - 0.48) / 0.14) - eio((u - 0.84) / 0.14);
    const P = N.map((p, i) => {
      const lift = u < 0.48 ? Math.sin(Math.PI * clamp((((u / 0.48) * 2) % 1 - i * 0.16) / 0.5)) : 0;
      return [lerp((i - 1) * 300, p[0], m), lerp(-110 * lift, p[1], m), lerp(112, p[2], m)];
    });
    sign(ctx, c.fg, { pos: (i) => P[i], solid: () => [0, 1], width: () => LW * m, dotScale: () => m });
  });

  // 4 — le linee piene si spezzano in pallini mentre i pallini si fondono in una linea
  add("scambio", "Scambio", (ctx, u, c) => {
    const m = sm(0.5 - 0.5 * Math.cos(TAU * u));
    ctx.strokeStyle = c.fg;
    ctx.lineCap = "round";
    const dashed = (A, B, k) => {
      // k = 0: linea piena; k = 1: tre pallini
      const Lg = Math.hypot(B[0] - A[0], B[1] - A[1]);
      const s0 = (A[2] + 62) / Lg,
        s1 = 1 - (B[2] + 62) / Lg;
      const gap = ((s1 - s0) * Lg) / (DOT_N - 1);
      ctx.lineWidth = lerp(LW, DOT_R * 2, k);
      for (let i = 0; i < DOT_N; i++) {
        const mid = lerp(s0, s1, i / (DOT_N - 1));
        const half = (lerp(gap * 0.62, 0.5, k) / Lg) * (i === 0 || i === DOT_N - 1 ? lerp(2.2, 1, k) : 1);
        ctx.beginPath();
        ctx.moveTo(lerp(A[0], B[0], mid - half), lerp(A[1], B[1], mid - half));
        ctx.lineTo(lerp(A[0], B[0], mid + half), lerp(A[1], B[1], mid + half));
        ctx.stroke();
      }
    };
    SOLID.forEach(([a, b]) => dashed(N[a], N[b], m));
    dashed(N[0], N[2], 1 - m);
    ctx.fillStyle = c.fg;
    N.forEach((p) => dot(ctx, p[0], p[1], p[2]));
  });

  // 5 — la grandezza passa da un nodo all'altro: il grande diventa piccolo, il piccolo medio…
  add("taglie", "Taglie", (ctx, u, c) => {
    const f = u * 3,
      k = Math.floor(f),
      g = eio((f - k) / 0.7);
    const P = N.map((p, i) => [p[0], p[1], lerp(N[(i + k) % 3][2], N[(i + k + 1) % 3][2], g)]);
    sign(ctx, c.fg, { pos: (i) => P[i] });
  });

  // 6 — una linea alla volta si gonfia e ingloba i suoi due nodi
  add("pillola", "Pillola", (ctx, u, c) => {
    sign(ctx, c.fg, {
      width: (j) => lerp(LW, 2 * Math.min(N[SOLID[j][0]][2], N[SOLID[j][1]][2]), sm(bump(u, 0.25 + j * 0.5, 0.25))),
    });
  });

  // 7 — un nodo viene tirato e mollato: il segno vibra come un elastico
  add("elastico", "Elastico", (ctx, u, c) => {
    const pull = (h) => (h < 0.22 ? eio(h / 0.22) : Math.exp(-(h - 0.22) * 8.5) * Math.cos((h - 0.22) * 24));
    const who = u < 0.5 ? 2 : 0,
      k = pull((u * 2) % 1);
    const dir = who === 2 ? [0.62, -0.78] : [-0.9, -0.44];
    const P = N.map((p, i) => (i === who ? [p[0] + dir[0] * 105 * k, p[1] + dir[1] * 105 * k, p[2]] : p));
    sign(ctx, c.fg, { pos: (i) => P[i] });
  });

  // 8 — nodi vuoti che si riempiono a turno
  add("contorno", "Contorno", (ctx, u, c) => {
    const ring = 34;
    ctx.strokeStyle = c.fg;
    SOLID.forEach(([a, b]) => seg(ctx, N[a], N[b], 0, 1, LW * 0.6));
    ctx.fillStyle = c.fg;
    const ds = dotsAt(N[0], N[2]);
    ds.forEach((s) => dot(ctx, lerp(N[0][0], N[2][0], s), lerp(N[0][1], N[2][1], s), DOT_R * 0.8));
    N.forEach((p, i) => {
      ctx.fillStyle = c.bg;
      dot(ctx, p[0], p[1], p[2]);
      ctx.strokeStyle = c.fg;
      ctx.lineWidth = ring;
      ctx.beginPath();
      ctx.arc(p[0], p[1], p[2] - ring / 2, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = c.fg;
      dot(ctx, p[0], p[1], (p[2] - 6) * sm(bump(u, 0.17 + i / 3, 0.27) * 1.6));
    });
  });

  // 9 — i nodi crescono fino a sovrapporsi: dove si incrociano, si bucano
  add("incroci", "Incroci", (ctx, u, c) => {
    const m = eio(u < 0.5 ? u * 2 : 2 - u * 2);
    sign(ctx, c.fg, { node: () => 0, width: () => LW * (1 - m), dotScale: () => 1 - m });
    ctx.fillStyle = c.fg;
    ctx.beginPath();
    N.forEach((p, i) => {
      const r = lerp(p[2], [185, 200, 225][i], m);
      const k = 1 - 0.36 * m; // si avvicinano un po', così restano nel quadrato
      ctx.moveTo(p[0] * k + r, p[1] * k);
      ctx.arc(p[0] * k, p[1] * k, r, 0, TAU);
    });
    ctx.fill("evenodd");
  });

  // 10 — i nodi saltano uno dopo l'altro, le linee li seguono
  add("salto", "Salto", (ctx, u, c) => {
    const P = N.map((p, i) => [p[0], p[1] - 150 * bump(u, 0.17 + i / 3, 0.2), p[2]]);
    sign(ctx, c.fg, { pos: (i) => P[i] });
  });

  // 11 — tutto a pallini: scorrono lungo i tre lati, da un nodo al successivo
  add("flusso", "Flusso", (ctx, u, c) => {
    ctx.fillStyle = c.fg;
    [
      [0, 1],
      [1, 2],
      [2, 0],
    ].forEach(([a, b]) => {
      const A = N[a],
        B = N[b];
      const Lg = Math.hypot(B[0] - A[0], B[1] - A[1]);
      const s0 = (A[2] + 20) / Lg,
        s1 = 1 - (B[2] + 20) / Lg;
      for (let k = 0; k < DOT_N; k++) {
        const f = (((k + u * DOT_N) / DOT_N) % 1 + 1) % 1; // ogni pallino fa tutta la linea in un giro
        const s = lerp(s0, s1, f);
        dot(ctx, lerp(A[0], B[0], s), lerp(A[1], B[1], s), DOT_R * 1.15 * Math.pow(Math.sin(Math.PI * f), 0.5));
      }
    });
    N.forEach((p) => dot(ctx, p[0], p[1], p[2]));
  });

  // 12 — il disco del logo si apre attorno al segno, che diventa bianco; poi si riapre il fondo
  add("inversione", "Inversione", (ctx, u, c) => {
    const R = 480;
    const draw = (color) => {
      ctx.save();
      ctx.scale(0.7, 0.7);
      sign(ctx, color);
      ctx.restore();
    };
    draw(c.fg);
    const clipTo = (r, fill, ink) => {
      if (r <= 0.5) return;
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.clip();
      ctx.fillStyle = fill;
      ctx.fillRect(-500, -500, 1000, 1000);
      draw(ink);
      ctx.restore();
    };
    clipTo(R * eio(u / 0.36), c.fg, c.bg);
    clipTo(R * eio((u - 0.5) / 0.36), c.bg, c.fg);
  });

  // ---- API ----
  const byId = {};
  L.forEach((l) => (byId[l.id] = l));
  const DEFAULTS = { fg: "#1055AD", bg: "#f1f5f9", period: 2.4 };
  // disegna un fotogramma: u da 0 a 1; il contesto va già centrato dove deve stare l'icona
  const drawOn = (ctx, id, u, size, o = {}) => {
    const c = { fg: o.fg || DEFAULTS.fg, bg: o.bg || DEFAULTS.bg };
    ctx.save();
    ctx.scale(size / 1000, size / 1000);
    byId[id].draw(ctx, ((u % 1) + 1) % 1, c);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
  window.PNLoaders = {
    list: L.map((l) => ({ id: l.id, name: l.name })),
    draw: drawOn,
    defaults: DEFAULTS,
  };
})();
// Avvia un'icona di caricamento PoliNetwork su un canvas. Va caricato dopo pn-loaders.js.
//   const stop = PNLoaders.start(canvas, "impulso", { fg: "#1055AD", bg: "#f1f5f9", period: 2.4 });
//   stop(); // per fermarla
(function () {
  window.PNLoaders.start = function (canvas, id, o = {}) {
    const ctx = canvas.getContext("2d");
    const period = o.period || window.PNLoaders.defaults.period;
    let raf = 0;
    const frame = (ms) => {
      const w = canvas.width,
        h = canvas.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.translate(w / 2, h / 2);
      window.PNLoaders.draw(ctx, id, ms / 1000 / period, Math.min(w, h), o);
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  };
})();
    </script>
    <script>
      const grid = document.getElementById("grid"), msg = document.getElementById("msg");
      let stops = [], colors = { fg: "#1055AD", bg: "#f8fafc" };
      function build() {
        stops.forEach((s) => s());
        stops = [];
        grid.innerHTML = "";
        PNLoaders.list.forEach((l) => {
          const b = document.createElement("button");
          b.className = "cell";
          b.style.setProperty("--cell", colors.bg);
          b.style.setProperty("--label", colors.label);
          const row = document.createElement("div");
          row.className = "sizes";
          const cs = [96, 48, 24].map((px) => {
            const c = document.createElement("canvas");
            c.width = c.height = px * 2;
            c.style.width = c.style.height = px + "px";
            row.append(c);
            return c;
          });
          const s = document.createElement("span");
          s.textContent = l.name;
          b.append(row, s);
          b.addEventListener("click", async () => {
            const code = `PNLoaders.start(canvas, "${l.id}", { fg: "${colors.fg}", bg: "${colors.bg}" });`;
            try { await navigator.clipboard.writeText(code); msg.textContent = "Codice di «" + l.name + "» copiato."; }
            catch (e) { msg.textContent = code; }
          });
          grid.append(b);
          cs.forEach((c) => stops.push(PNLoaders.start(c, l.id, colors)));
        });
      }
      document.querySelectorAll(".bar button").forEach((b) => b.addEventListener("click", () => {
        document.querySelectorAll(".bar button").forEach((x) => x.setAttribute("aria-pressed", x === b));
        colors = { fg: b.dataset.fg, bg: b.dataset.bg, label: b.dataset.label };
        build();
      }));
      colors.label = "#45556c";
      build();
    </script>
  </body>
</html>
