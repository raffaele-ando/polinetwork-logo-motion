<!doctype html>
<html
  lang="it"
  data-composition-variables='[{"id":"nome","type":"string","label":"Nome sotto al logo","default":"PoliNetwork"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/logo-paths.js"></script>
    <script src="assets/pn-core.js"></script>
    <style>
      @font-face {
        font-family: "Red Hat Text";
        src: url("assets/fonts/RedHatText.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #041230;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #041230;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #titolo,
      #titolo-zoom,
      #buio {
        position: absolute;
        inset: 0;
      }
      #nome {
        position: absolute;
        left: 0;
        right: 0;
        top: 752px;
        text-align: center;
        font-family: "Red Hat Text", sans-serif;
        font-weight: 500;
        font-size: 96px;
        line-height: 1;
        color: #f8fafc;
        white-space: nowrap;
      }
      #buio-nero {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.5"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <!-- Cielo, pallini in volo, anello, logo -->
      <canvas
        id="stage"
        class="clip"
        data-start="0"
        data-duration="8.5"
        data-track-index="0"
        data-layout-ignore
        width="1920"
        height="1080"
        style="z-index: 1"
      ></canvas>

      <!-- Il nome sotto al logo -->
      <div
        id="titolo"
        class="clip"
        data-start="5.25"
        data-duration="3.25"
        data-track-index="1"
        style="z-index: 2"
      >
        <div id="titolo-zoom"><h1 id="nome" data-var-text="nome">PoliNetwork</h1></div>
      </div>

      <!-- Chiusura al nero -->
      <div
        id="buio"
        class="clip"
        data-start="7.8"
        data-duration="0.7"
        data-track-index="2"
        data-layout-ignore
        style="z-index: 3"
      >
        <div id="buio-nero"></div>
      </div>

      <audio
        id="suono"
        class="clip"
        data-start="0"
        data-duration="8.5"
        data-track-index="3"
        data-volume="1"
        src="assets/audio/orbita.wav"
      ></audio>
    </div>

    <script>
      (function () {
        const { clamp, lerp, prog, smooth, outCubic, outQuart, inOutCubic, outBack, LOGO } = PN;
        const W = 1920,
          H = 1080;
        const ctx = document.getElementById("stage").getContext("2d");

        // ---- tempi (secondi) ----
        const N_RING = 24; // pallini che formano l'anello
        const FLY = 1.45; // durata di ogni volo
        const RING_T0 = 0.4,
          RING_GAP = 0.085; // partenza del primo pallino e distanza tra uno e l'altro
        const NODE_T0 = 2.5,
          NODE_GAP = 0.13; // i sei pallini grandi che diventano i nodi
        const T_FUSE = 3.85; // l'anello di pallini comincia a fondersi
        const T_LOCK = 4.65; // anello chiuso: impatto
        const T_END = 8.5;

        // ---- logo sullo schermo ----
        const CX = 960,
          CY = 430,
          S = 0.5;
        const ringR = ((LOGO.ringIn + LOGO.ringOut) / 2) * S;
        const ringW = (LOGO.ringOut - LOGO.ringIn) * S;
        const NODE_ORDER = [4, 0, 2, 1, 5, 3];
        // linee piene: da, a, inizio, durata
        const SOLID = [
          [2, 0, 4.78, 0.3],
          [2, 1, 4.86, 0.3],
          [1, 5, 4.96, 0.38],
          [5, 4, 5.08, 0.3],
          [5, 3, 5.16, 0.32],
        ];
        const DOT_T0 = [5.0, 5.1, 5.2, 5.32];
        const T_REAL = 5.95; // dissolvenza sui tracciati originali

        // ---- le traiettorie ----
        const rnd = PN.rng(1863);
        const fliers = [];
        const mk = (tx, ty, r, t0, kind, idx) => {
          const j = rnd(),
            j2 = rnd();
          fliers.push({
            t0,
            r,
            kind,
            idx,
            p0: [-140 - 80 * j, 640 + 70 * j2],
            p1: [760 + 160 * j2, 560 + 60 * j],
            p2: [2120 + 220 * j, 1010 - 0.5 * (CY + 240 - ty) + 60 * j2],
            p3: [tx, ty],
            peak: 1.5 + 0.9 * j,
          });
        };
        for (let k = 0; k < N_RING; k++) {
          const a = (100 * Math.PI) / 180 + (k * 2 * Math.PI) / N_RING;
          mk(CX + Math.cos(a) * ringR, CY + Math.sin(a) * ringR, ringW / 2, RING_T0 + k * RING_GAP, "ring", k);
          fliers[fliers.length - 1].angle = a;
        }
        NODE_ORDER.forEach((n, j) => {
          const [x, y, r] = LOGO.nodes[n];
          mk(CX + (x - LOGO.c) * S, CY + (y - LOGO.c) * S, r * S, NODE_T0 + j * NODE_GAP, "node", n);
        });
        const nodeLand = {};
        fliers.forEach((f) => {
          if (f.kind === "node") nodeLand[f.idx] = f.t0 + FLY;
        });

        const bez = (f, e, out) => {
          const m = 1 - e;
          const a = m * m * m,
            b = 3 * m * m * e,
            c = 3 * m * e * e,
            d = e * e * e;
          out.x = a * f.p0[0] + b * f.p1[0] + c * f.p2[0] + d * f.p3[0];
          out.y = a * f.p0[1] + b * f.p1[1] + c * f.p2[1] + d * f.p3[1];
          return out;
        };
        // dove si trova un pallino al tempo t: posizione e grandezza (lontano = piccolo, vicino = grande)
        const flight = (f, t, out) => {
          const u = prog(t, f.t0, FLY);
          const e = lerp(u, outCubic(u), 0.72);
          bez(f, e, out);
          out.u = u;
          out.s = lerp(0.1, 1, e) + f.peak * Math.pow(Math.sin(Math.PI * e), 1.6);
          return out;
        };

        const FAN_A = { a0: [-60, 300], a1: [620, 1140], c0: [420, 300], c1: [760, 600], b0: [900, -40], b1: [60, -40] };
        const FAN_B = {
          a0: [1980, 420],
          a1: [1180, 1140],
          c0: [1460, 520],
          c1: [1200, 760],
          b0: [1160, 1140],
          b1: [1980, 1000],
        };
        const P = { x: 0, y: 0, s: 0, u: 0 },
          Q = { x: 0, y: 0, s: 0, u: 0 };

        function renderAt(t) {
          t = clamp(t, 0, T_END);
          const lock = t - T_LOCK;
          const real = smooth(prog(t, T_REAL, 0.25));
          const punch = lock > 0 ? 0.05 * Math.exp(-lock * 5.5) * prog(lock, 0, 0.04) : 0;
          const zoom = 1 + punch + (lock > 0 ? (0.035 * lock) / (T_END - T_LOCK) : 0);
          const drift = t / T_END; // lento movimento del cielo

          // ---- cielo ----
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          const sky = ctx.createLinearGradient(0, 0, 0, H);
          sky.addColorStop(0, "#030d26");
          sky.addColorStop(0.45, "#082a66");
          sky.addColorStop(0.8, "#0f4a9c");
          sky.addColorStop(1, "#1a66bd");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = "lighter";
          // macchie di luce sfumate, come negli sfondi del sito
          PN.glow(ctx, 220 + 90 * drift, 800 + 60 * drift, 900, 0.34, "119,212,255");
          PN.glow(ctx, 1700 - 70 * drift, 980 + 40 * drift, 820, 0.3, "81,162,255");
          PN.glow(ctx, 1500 - 40 * drift, 120 + 50 * drift, 700, 0.16, "25,60,184");
          ctx.save();
          ctx.translate(0, 30 * drift);
          PN.fan(ctx, FAN_A, 30, 0.1, "219,234,254");
          PN.fan(ctx, FAN_B, 26, 0.1, "186,230,253");
          ctx.restore();
          // dopo l'impatto il cielo dietro al logo si fa più profondo, così il disco blu stacca
          const deep = smooth(prog(t, T_LOCK - 0.2, 0.7));
          if (deep > 0) {
            ctx.globalCompositeOperation = "source-over";
            const g = ctx.createRadialGradient(CX, CY + 60, 120, CX, CY + 60, 820);
            g.addColorStop(0, `rgba(3,13,38,${0.62 * deep})`);
            g.addColorStop(1, "rgba(3,13,38,0)");
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
          }

          ctx.translate(W / 2, H / 2);
          ctx.scale(zoom, zoom);
          ctx.translate(-W / 2, -H / 2);

          // alone dietro al logo
          ctx.globalCompositeOperation = "lighter";
          PN.glow(ctx, CX, CY, 600, 0.3 * smooth(prog(t, T_LOCK - 0.3, 0.5)), "59,130,246");

          if (real < 1) {
            ctx.save();
            ctx.globalAlpha = 1 - real;

            // disco blu: si riempie dall'anello verso il centro
            const fill = outCubic(prog(t, T_LOCK - 0.02, 0.34));
            if (fill > 0) {
              ctx.globalCompositeOperation = "source-over";
              const rOut = LOGO.disc * S + 1;
              ctx.fillStyle = LOGO.blue;
              ctx.beginPath();
              ctx.arc(CX, CY, rOut, 0, 6.2832);
              ctx.arc(CX, CY, rOut * (1 - fill), 0, 6.2832, true);
              ctx.fill("evenodd");
            }

            // linee piene e linee a pallini, dopo l'impatto
            ctx.globalCompositeOperation = "source-over";
            ctx.lineCap = "butt";
            const pos = (i) => [CX + (LOGO.nodes[i][0] - LOGO.c) * S, CY + (LOGO.nodes[i][1] - LOGO.c) * S];
            for (const [a, b, t0, dur] of SOLID) {
              const g = outCubic(prog(t, t0, dur));
              if (g <= 0) continue;
              const A = pos(a),
                B = pos(b);
              const ex = lerp(A[0], B[0], g),
                ey = lerp(A[1], B[1], g);
              ctx.strokeStyle = LOGO.white;
              ctx.lineWidth = LOGO.solidW * S;
              ctx.beginPath();
              ctx.moveTo(A[0], A[1]);
              ctx.lineTo(ex, ey);
              ctx.stroke();
              if (g < 1) {
                ctx.globalCompositeOperation = "lighter";
                PN.glow(ctx, ex, ey, 60, 0.8, "186,230,253");
                ctx.globalCompositeOperation = "source-over";
              }
            }
            for (const d of LOGO.dots) {
              const g = prog(t, DOT_T0[d.line] + d.k * 0.03, 0.22);
              if (g <= 0) continue;
              const A = pos(d.a),
                B = pos(d.b);
              PN.disc(
                ctx,
                lerp(A[0], B[0], d.s),
                lerp(A[1], B[1], d.s),
                LOGO.dotR * S * outBack(g, 2.5),
                0,
                1,
                "254,254,254",
              );
            }

            // ---- i pallini ----
            const fuse = inOutCubic(prog(t, T_FUSE, T_LOCK - T_FUSE));
            const spin = fuse * Math.PI * 0.75; // l'anello gira mentre si fonde
            for (const f of fliers) {
              if (t < f.t0) continue;
              flight(f, t, P);
              const landed = P.u >= 1;
              if (!landed) {
                // scia
                ctx.globalCompositeOperation = "lighter";
                for (let j = 14; j >= 1; j--) {
                  const tj = t - j * 0.011;
                  if (tj < f.t0) continue;
                  flight(f, tj, Q);
                  const fade = 1 - j / 15;
                  PN.disc(ctx, Q.x, Q.y, f.r * Q.s * (0.35 + 0.65 * fade), 2 + Q.s * 2, 0.16 * fade * fade, "186,230,253");
                }
                const r = f.r * P.s;
                const blur = Math.max(0, P.s - 1.15) * 9;
                PN.glow(ctx, P.x, P.y, r * 4.5 + 20, 0.5 * Math.min(1, P.u * 6), "147,197,253");
                ctx.globalCompositeOperation = "source-over";
                PN.disc(ctx, P.x, P.y, r, blur, Math.min(1, P.u * 8), "254,254,254");
                continue;
              }
              // atterrato
              const since = t - (f.t0 + FLY);
              const pop = 1 + 0.35 * Math.exp(-since * 9) * Math.cos(since * 22);
              ctx.globalCompositeOperation = "lighter";
              const twinkle = Math.exp(-since * 4.5);
              if (f.kind === "ring") {
                const a = f.angle + spin;
                const x = CX + Math.cos(a) * ringR,
                  y = CY + Math.sin(a) * ringR;
                if (lock < 0.3) PN.glow(ctx, x, y, 46 + 40 * twinkle, 0.3 + 0.6 * twinkle, "147,197,253");
                ctx.globalCompositeOperation = "source-over";
                const half = fuse * (Math.PI / N_RING + 0.01);
                ctx.strokeStyle = LOGO.white;
                ctx.lineCap = fuse < 1 ? "round" : "butt";
                ctx.lineWidth = lerp(ringW * pop, ringW, fuse);
                ctx.beginPath();
                ctx.arc(CX, CY, ringR, a - half - 0.0005, a + half + 0.0005);
                ctx.stroke();
              } else {
                if (lock < 0.3) PN.glow(ctx, P.x, P.y, f.r * 3.6 + 50 * twinkle, 0.3 + 0.55 * twinkle, "147,197,253");
                if (since < 0.7) {
                  const pg = since / 0.7;
                  ctx.strokeStyle = `rgba(186,230,253,${0.7 * (1 - pg) * (1 - pg)})`;
                  ctx.lineWidth = 2.5;
                  ctx.beginPath();
                  ctx.arc(P.x, P.y, f.r * (1 + outCubic(pg) * 2.6), 0, 6.2832);
                  ctx.stroke();
                }
                ctx.globalCompositeOperation = "source-over";
                PN.disc(ctx, P.x, P.y, f.r * pop, 0, 1, "254,254,254");
              }
            }
            ctx.restore();
          }

          // ---- il logo originale ----
          ctx.globalCompositeOperation = "source-over";
          PN.drawLogo(ctx, CX, CY, S, real);

          // ---- impatto: lampo e onda ----
          if (lock > 0 && lock < 1.4) {
            ctx.globalCompositeOperation = "lighter";
            PN.glow(ctx, CX, CY, 900, 0.7 * Math.exp(-lock * 6.5), "219,234,254");
            const wg = prog(lock, 0, 1.3);
            ctx.strokeStyle = `rgba(186,230,253,${0.55 * (1 - wg) * (1 - wg)})`;
            ctx.lineWidth = lerp(10, 2, wg);
            ctx.beginPath();
            ctx.arc(CX, CY, lerp(240, 1500, outCubic(wg)), 0, 6.2832);
            ctx.stroke();
          }

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          PN.vignette(ctx, W, H, 0.5);
          const open = 1 - smooth(prog(t, 0, 0.5));
          if (open > 0) {
            ctx.fillStyle = `rgba(0,0,0,${open})`;
            ctx.fillRect(0, 0, W, H);
          }
        }

        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);

        // ---- nome e chiusura: elementi normali della pagina, modificabili ----
        const tl = gsap.timeline({ paused: true });
        const zoomAt = (t) => 1 + (0.035 * (t - T_LOCK)) / (T_END - T_LOCK);
        tl.fromTo(
          "#titolo-zoom",
          { scale: zoomAt(5.25), transformOrigin: "960px 540px" },
          { scale: zoomAt(8.5), duration: 3.25, ease: "none" },
          5.25,
        );
        tl.fromTo(
          "#nome",
          { opacity: 0, scale: 1.16, filter: "blur(14px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.1, ease: "power3.out" },
          5.3,
        );
        tl.fromTo("#buio-nero", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.in" }, 7.8);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
