<!doctype html>
<html
  lang="it"
  data-composition-variables='[{"id":"nome","type":"string","label":"Nome sotto al logo","default":"PoliNetwork"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/logo-paths.js"></script>
    <script src="assets/pn-core.js"></script>
    <style>
      @font-face {
        font-family: "Red Hat Text";
        src: url("assets/fonts/RedHatText.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #02060f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #02060f;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #titolo,
      #titolo-zoom,
      #buio {
        position: absolute;
        inset: 0;
      }
      #nome {
        position: absolute;
        left: 0;
        right: 0;
        top: 752px;
        text-align: center;
        font-family: "Red Hat Text", sans-serif;
        font-weight: 500;
        font-size: 96px;
        line-height: 1;
        color: #f8fafc;
        white-space: nowrap;
      }
      #buio-nero {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <!-- Tutta la scena 3D: rete, anello, logo -->
      <canvas
        id="stage"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-layout-ignore
        width="1920"
        height="1080"
        style="z-index: 1"
      ></canvas>

      <!-- Il nome sotto al logo -->
      <div
        id="titolo"
        class="clip"
        data-start="4.95"
        data-duration="3.05"
        data-track-index="1"
        style="z-index: 2"
      >
        <div id="titolo-zoom"><h1 id="nome" data-var-text="nome">PoliNetwork</h1></div>
      </div>

      <!-- Chiusura al nero -->
      <div
        id="buio"
        class="clip"
        data-start="7.3"
        data-duration="0.7"
        data-track-index="2"
        data-layout-ignore
        style="z-index: 3"
      >
        <div id="buio-nero"></div>
      </div>

      <audio
        id="suono"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="3"
        data-volume="1"
        src="assets/audio/rete.wav"
      ></audio>
    </div>

    <script>
      (function () {
        const { clamp, lerp, prog, smooth, outCubic, outQuart, outExpo, inCubic, inOutCubic, outBack, LOGO } = PN;
        const W = 1920,
          H = 1080;
        const ctx = document.getElementById("stage").getContext("2d");

        // ---- tempi (secondi) ----
        const T_LOCK = 4.6; // la camera si ferma: la rete diventa il logo
        const T_END = 8;

        // ---- logo sullo schermo ----
        const CX = 960,
          CY = 430,
          S = 0.5; // 480 px di diametro
        const F = 1800; // focale: a distanza F un'unità del mondo è un pixel

        // ---- i sei nodi del logo nello spazio: ognuno a una profondità diversa ----
        const HZ = [-430, 360, 150, -280, 310, -140];
        const hero = LOGO.nodes.map(([x, y, r], i) => {
          const k = (F + HZ[i]) / F;
          return { x: (x - LOGO.c) * S * k, y: (y - LOGO.c) * S * k, z: HZ[i], r: r * S * k };
        });
        const H_ON = [1.0, 1.25, 0.3, 2.35, 2.1, 1.8]; // quando si accende ogni nodo
        // linee piene: da, a, inizio, durata
        const H_SOLID = [
          [2, 0, 0.62, 0.38],
          [2, 1, 0.9, 0.35],
          [1, 5, 1.32, 0.48],
          [5, 4, 1.8, 0.3],
          [5, 3, 1.98, 0.37],
        ];
        const H_DOT_T0 = [2.35, 2.5, 2.65, 2.85]; // partenza di ogni linea a pallini

        // ---- la rete intorno: tanti altri nodi, gli studenti ----
        const rnd = PN.rng(20260);
        const field = [];
        let guard = 0;
        while (field.length < 340 && guard++ < 5000) {
          const p = { x: (rnd() * 2 - 1) * 2900, y: (rnd() * 2 - 1) * 1650, z: (rnd() * 2 - 1) * 1700 };
          const k = F / (F + p.z);
          const sx = p.x * k,
            sy = p.y * k;
          if (Math.hypot(sx, sy) < 345) continue; // spazio libero attorno al logo
          if (Math.abs(sx) < 420 && Math.abs(sy - 370) < 95) continue; // e attorno al nome
          if (Math.hypot(p.x, p.y, p.z) < 420) continue;
          p.r = 5 + rnd() * 8;
          p.seed = rnd();
          const d = Math.hypot(p.x - hero[2].x, p.y - hero[2].y, p.z - hero[2].z);
          p.on = 0.5 + Math.pow(d / 3600, 0.9) * 2.1 + rnd() * 0.25;
          field.push(p);
        }
        // ogni nodo si collega ai due più vicini
        const fEdges = [];
        const seen = new Set();
        field.forEach((p, i) => {
          const near = field
            .map((q, j) => [j, i === j ? 1e9 : Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z)])
            .sort((a, b) => a[1] - b[1])
            .slice(0, 2);
          for (const [j, d] of near) {
            const key = i < j ? i + "-" + j : j + "-" + i;
            if (seen.has(key) || d > 900) continue;
            seen.add(key);
            const a = field[i].on <= field[j].on ? i : j;
            const b = a === i ? j : i;
            fEdges.push({ a, b, t0: field[a].on + 0.05, dur: 0.3 + d / 2600, seed: rnd() });
          }
        });

        // ---- camera ----
        function camera(t) {
          const u = clamp(t / T_LOCK);
          const e = inOutCubic(u);
          const yaw = 1.45 * (1 - e) - 0.014 * Math.max(0, t - T_LOCK);
          const pitch = -0.42 * (1 - e);
          const D = lerp(560, F, smooth(clamp(t / 4.2)));
          const k = 1 - smooth(clamp(t / 2.8));
          return {
            yaw,
            pitch,
            D,
            tx: hero[2].x * k,
            ty: hero[2].y * k,
            tz: hero[2].z * k,
            cy: Math.cos(yaw),
            sy: Math.sin(yaw),
            cp: Math.cos(pitch),
            sp: Math.sin(pitch),
          };
        }
        function project(c, p, out) {
          const x = p.x - c.tx,
            y = p.y - c.ty,
            z = p.z - c.tz;
          const x1 = x * c.cy + z * c.sy,
            z1 = -x * c.sy + z * c.cy;
          const y2 = y * c.cp - z1 * c.sp,
            z2 = y * c.sp + z1 * c.cp;
          const depth = z2 + c.D;
          out.depth = depth;
          out.k = depth > 30 ? F / depth : 0;
          out.x = CX + x1 * out.k;
          out.y = CY + y2 * out.k;
          out.z = z2;
          return out;
        }

        const P = { x: 0, y: 0, k: 0, depth: 0, z: 0 },
          Q = { x: 0, y: 0, k: 0, depth: 0, z: 0 };
        const hp = hero.map(() => ({ x: 0, y: 0, k: 0, depth: 0, z: 0 }));

        const FAN_A = { a0: [-60, 420], a1: [520, 1140], c0: [380, 380], c1: [700, 620], b0: [760, -40], b1: [60, -40] };
        const FAN_B = {
          a0: [1980, 520],
          a1: [1280, 1140],
          c0: [1500, 560],
          c1: [1260, 760],
          b0: [1240, 1140],
          b1: [1980, 1000],
        };

        function renderAt(t) {
          t = clamp(t, 0, T_END);
          const cam = camera(t);
          const lock = t - T_LOCK; // > 0 dopo l'impatto
          const settle = smooth(prog(t, 3.5, 1.1)); // la profondità di campo si chiude sul logo
          const flat = smooth(prog(t, T_LOCK - 0.05, 0.3)); // da luce a logo piatto
          const real = smooth(prog(t, T_LOCK + 0.16, 0.26)); // dissolvenza sui tracciati originali

          // spinta di camera all'impatto, poi lento avvicinamento
          const punch = lock > 0 ? 0.05 * Math.exp(-lock * 5.5) * prog(lock, 0, 0.04) : 0;
          const zoom = 1 + punch + (lock > 0 ? (0.035 * lock) / (T_END - T_LOCK) : 0);

          // ---- fondo ----
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#02060f";
          ctx.fillRect(0, 0, W, H);
          const amb = 0.1 + 0.16 * smooth(prog(t, 0.2, 3)) + 0.3 * smooth(prog(t, T_LOCK, 0.5));
          PN.glow(ctx, CX - 260 + cam.yaw * 420, 300, 1150, amb * 0.55, "20,71,230");
          PN.glow(ctx, CX + 520 + cam.yaw * 260, 860, 900, amb * 0.4, "3,105,168");
          const fanA = 0.13 * smooth(prog(t, T_LOCK + 0.1, 1.4));
          ctx.save();
          ctx.translate(W / 2, H / 2);
          ctx.scale(1 + (zoom - 1) * 0.5, 1 + (zoom - 1) * 0.5);
          ctx.translate(-W / 2, -H / 2);
          PN.fan(ctx, FAN_A, 26, fanA, "147,197,253");
          PN.fan(ctx, FAN_B, 22, fanA, "119,212,255");
          ctx.restore();

          ctx.translate(W / 2, H / 2);
          ctx.scale(zoom, zoom);
          ctx.translate(-W / 2, -H / 2);

          // ---- la rete intorno ----
          ctx.globalCompositeOperation = "lighter";
          const fieldDim = lerp(1, 0.7, smooth(prog(t, 3.3, 1.2))) * lerp(1, 0.6, smooth(prog(lock, 0, 0.6)));
          const push = lock > 0 ? outQuart(prog(lock, 0, 1.1)) : 0; // onda d'urto
          const shove = (o) => {
            const dx = o.x - CX,
              dy = o.y - CY,
              d = Math.hypot(dx, dy) || 1;
            const amt = push * 150 * Math.exp(-d / 900);
            o.x += (dx / d) * amt;
            o.y += (dy / d) * amt;
          };
          ctx.lineCap = "round";
          for (const e of fEdges) {
            const g = prog(t, e.t0, e.dur);
            if (g <= 0) continue;
            project(cam, field[e.a], P);
            project(cam, field[e.b], Q);
            if (P.k === 0 || Q.k === 0 || P.depth < 220 || Q.depth < 220) continue;
            shove(P);
            shove(Q);
            const ge = outCubic(g);
            const ex = lerp(P.x, Q.x, ge),
              ey = lerp(P.y, Q.y, ge);
            const kk = (P.k + Q.k) / 2;
            const a = clamp(kk * 0.62, 0.1, 0.75) * fieldDim;
            ctx.strokeStyle = `rgba(96,165,250,${a})`;
            ctx.lineWidth = Math.max(1, 1.8 * kk);
            ctx.beginPath();
            ctx.moveTo(P.x, P.y);
            ctx.lineTo(ex, ey);
            ctx.stroke();
            // un messaggio che corre lungo il collegamento
            if (e.seed < 0.6 && g >= 1) {
              const ph = ((t - e.t0) / (0.9 + e.seed) + e.seed * 7) % 1;
              const mx = lerp(P.x, Q.x, ph),
                my = lerp(P.y, Q.y, ph);
              const ma = Math.sin(Math.PI * ph) * fieldDim * (1 - 0.6 * prog(lock, 0, 0.8));
              PN.disc(ctx, mx, my, 2.6 * kk, 1.5, ma * 0.9, "191,219,254");
            }
          }
          for (const p of field) {
            const g = prog(t, p.on, 0.3);
            if (g <= 0) continue;
            project(cam, p, P);
            if (P.k === 0 || P.depth < 160) continue;
            shove(P);
            if (P.x < -200 || P.x > W + 200 || P.y < -200 || P.y > H + 200) continue;
            const near = clamp((P.depth - 160) / 500);
            const r = p.r * P.k * (1 + 0.9 * Math.exp(-(t - p.on) * 7));
            const blur = Math.min(46, (Math.abs(P.depth - cam.D) / P.depth) * 24);
            const tw = 0.82 + 0.18 * Math.sin(t * (1.3 + p.seed * 2) + p.seed * 40);
            const a = g * near * fieldDim * tw;
            PN.glow(ctx, P.x, P.y, r * 6 + blur, a * 0.5, "59,130,246");
            PN.disc(ctx, P.x, P.y, r, blur, a * 0.95, "219,234,254");
          }

          // ---- i sei nodi ----
          hero.forEach((n, i) => project(cam, n, hp[i]));
          const ringR = ((LOGO.ringIn + LOGO.ringOut) / 2) * S;
          const ringW = (LOGO.ringOut - LOGO.ringIn) * S;

          // alone dietro al logo, dall'impatto in poi
          if (lock > -0.4) {
            const ha = 0.5 * smooth(prog(t, T_LOCK - 0.3, 0.5)) * (1 - 0.35 * smooth(prog(lock, 0.3, 1.5)));
            PN.glow(ctx, CX, CY, 620, ha, "37,99,235");
          }

          if (real < 1) {
            ctx.save();
            ctx.globalAlpha = 1 - real;

            // disco blu: si riempie dall'anello verso il centro
            const fill = outCubic(prog(t, T_LOCK - 0.02, 0.34));
            if (fill > 0) {
              ctx.globalCompositeOperation = "source-over";
              const rOut = LOGO.disc * S + 1,
                rIn = rOut * (1 - fill);
              ctx.fillStyle = LOGO.blue;
              ctx.beginPath();
              ctx.arc(CX, CY, rOut, 0, 6.2832);
              ctx.arc(CX, CY, rIn, 0, 6.2832, true);
              ctx.fill("evenodd");
            }

            // anello: due scie di luce partono dal basso e si chiudono in alto
            const sweep = inOutCubic(prog(t, 3.72, T_LOCK - 3.72));
            if (sweep > 0) {
              const ang = sweep * Math.PI;
              const w = lerp(2.5, ringW, smooth(prog(t, T_LOCK - 0.1, 0.3)));
              ctx.globalCompositeOperation = flat > 0.5 ? "source-over" : "lighter";
              ctx.lineCap = "butt";
              if (flat < 1) {
                ctx.strokeStyle = `rgba(96,165,250,${0.35 * (1 - flat)})`;
                ctx.lineWidth = w + 14;
                ctx.beginPath();
                ctx.arc(CX, CY, ringR, Math.PI / 2 - ang, Math.PI / 2 + ang);
                ctx.stroke();
              }
              ctx.strokeStyle = LOGO.white;
              ctx.lineWidth = w;
              ctx.beginPath();
              ctx.arc(CX, CY, ringR, Math.PI / 2 - ang - 0.004, Math.PI / 2 + ang + 0.004);
              ctx.stroke();
              if (sweep < 1) {
                ctx.globalCompositeOperation = "lighter";
                for (const sgn of [-1, 1]) {
                  const a = Math.PI / 2 + sgn * ang;
                  const hx = CX + Math.cos(a) * ringR,
                    hy = CY + Math.sin(a) * ringR;
                  PN.glow(ctx, hx, hy, 90, 0.9, "147,197,253");
                  PN.disc(ctx, hx, hy, 5, 3, 1);
                }
              }
            }

            // linee piene
            ctx.globalCompositeOperation = flat > 0.5 ? "source-over" : "lighter";
            ctx.lineCap = "butt";
            for (const [a, b, t0, dur] of H_SOLID) {
              const g = outCubic(prog(t, t0, dur));
              if (g <= 0) continue;
              const A = hp[a],
                B = hp[b];
              if (A.k === 0 || B.k === 0) continue;
              const ex = lerp(A.x, B.x, g),
                ey = lerp(A.y, B.y, g);
              const w = LOGO.solidW * S * ((A.k * (F + hero[a].z)) / F + (B.k * (F + hero[b].z)) / F) * 0.5;
              if (flat < 1) {
                ctx.strokeStyle = `rgba(59,130,246,${0.3 * (1 - flat)})`;
                ctx.lineWidth = w + 16;
                ctx.beginPath();
                ctx.moveTo(A.x, A.y);
                ctx.lineTo(ex, ey);
                ctx.stroke();
              }
              ctx.strokeStyle = LOGO.white;
              ctx.lineWidth = w;
              ctx.beginPath();
              ctx.moveTo(A.x, A.y);
              ctx.lineTo(ex, ey);
              ctx.stroke();
              if (g < 1) PN.glow(ctx, ex, ey, 70, 0.8, "147,197,253");
            }

            // linee a pallini: si accendono uno alla volta
            for (const d of LOGO.dots) {
              const t0 = H_DOT_T0[d.line] + d.k * 0.036;
              const g = prog(t, t0, 0.22);
              if (g <= 0) continue;
              const na = hero[d.a],
                nb = hero[d.b];
              // il pallino sta sulla retta tra i due nodi, nello spazio; s è misurato sul logo piatto
              const fa = LOGO.nodes[d.a],
                fb = LOGO.nodes[d.b];
              const fx = (lerp(fa[0], fb[0], d.s) - LOGO.c) * S,
                fy = (lerp(fa[1], fb[1], d.s) - LOGO.c) * S;
              const z = lerp(na.z, nb.z, d.s),
                kz = (F + z) / F;
              project(cam, { x: fx * kz, y: fy * kz, z }, P);
              if (P.k === 0) continue;
              const r = LOGO.dotR * S * kz * P.k * outBack(g, 2.5);
              if (flat < 1) PN.glow(ctx, P.x, P.y, r * 6, 0.35 * (1 - flat) * g, "96,165,250");
              PN.disc(ctx, P.x, P.y, r, 0, 1, "254,254,254");
            }

            // nodi
            hero.forEach((n, i) => {
              const g = prog(t, H_ON[i], 0.3);
              if (g <= 0) return;
              const p = hp[i];
              if (p.k === 0 || p.depth < 60) return;
              const r = n.r * p.k * outBack(g, 2.2);
              const blur = Math.min(60, (Math.abs(p.depth - cam.D) / p.depth) * 22) * (1 - settle);
              if (flat < 1) {
                ctx.globalCompositeOperation = "lighter";
                PN.glow(ctx, p.x, p.y, r * 4.2 + blur, 0.5 * (1 - flat) * g, "59,130,246");
                // anello che si allarga quando il nodo si accende
                const pg = prog(t, H_ON[i], 0.75);
                if (pg > 0 && pg < 1) {
                  ctx.strokeStyle = `rgba(147,197,253,${0.7 * (1 - pg) * (1 - pg)})`;
                  ctx.lineWidth = 2.5;
                  ctx.beginPath();
                  ctx.arc(p.x, p.y, r * (1 + outCubic(pg) * 3.2), 0, 6.2832);
                  ctx.stroke();
                }
              }
              ctx.globalCompositeOperation = flat > 0.5 ? "source-over" : "lighter";
              PN.disc(ctx, p.x, p.y, r, blur, 1, "254,254,254");
            });
            ctx.restore();
          }

          // ---- il logo originale ----
          ctx.globalCompositeOperation = "source-over";
          PN.drawLogo(ctx, CX, CY, S, real);

          // ---- impatto: lampo e onda ----
          if (lock > 0 && lock < 1.4) {
            ctx.globalCompositeOperation = "lighter";
            const fl = Math.exp(-lock * 6.5);
            PN.glow(ctx, CX, CY, 900, 0.75 * fl, "191,219,254");
            const wg = prog(lock, 0, 1.3);
            const wr = lerp(240, 1500, outCubic(wg));
            ctx.strokeStyle = `rgba(147,197,253,${0.5 * (1 - wg) * (1 - wg)})`;
            ctx.lineWidth = lerp(10, 2, wg);
            ctx.beginPath();
            ctx.arc(CX, CY, wr, 0, 6.2832);
            ctx.stroke();
          }

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          PN.vignette(ctx, W, H, 0.62);
          // apertura dal nero
          const open = 1 - smooth(prog(t, 0, 0.35));
          if (open > 0) {
            ctx.fillStyle = `rgba(0,0,0,${open})`;
            ctx.fillRect(0, 0, W, H);
          }
        }

        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__pnRender = renderAt;

        // ---- nome e chiusura: elementi normali della pagina, modificabili ----
        const tl = gsap.timeline({ paused: true });
        const zoomAt = (t) => 1 + (0.035 * (t - T_LOCK)) / (T_END - T_LOCK);
        tl.fromTo(
          "#titolo-zoom",
          { scale: zoomAt(4.95), transformOrigin: "960px 540px" },
          { scale: zoomAt(8), duration: 3.05, ease: "none" },
          4.95,
        );
        tl.fromTo(
          "#nome",
          { opacity: 0, scale: 1.16, filter: "blur(14px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.1, ease: "power3.out" },
          5.0,
        );
        tl.fromTo("#buio-nero", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.in" }, 7.3);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
